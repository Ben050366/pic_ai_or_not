<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HIVE API 图片检测测试</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
        }
        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: #ddd;
            cursor: pointer;
            border-radius: 4px;
        }
        .tab-btn.active {
            background: #007bff;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px dashed #ddd;
            border-radius: 4px;
            cursor: pointer;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .score-bar {
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            margin: 5px 0;
            overflow: hidden;
        }
        .score-fill {
            height: 100%;
            transition: width 0.3s ease;
        }
        .ai-generated {
            background: #ff6b6b;
        }
        .not-ai-generated {
            background: #4ecdc4;
        }
        .deepfake {
            background: #ffd93d;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        #previewImage {
            max-width: 100%;
            max-height: 300px;
            margin: 10px 0;
            display: none;
            border-radius: 4px;
        }
        .usage-info {
            background: #e3f2fd;
            padding: 10px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>HIVE AI图片检测工具</h1>
        
        <div id="usageInfo" class="usage-info">
            加载使用信息中...
        </div>
        
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('url')">图片URL</button>
            <button class="tab-btn" onclick="switchTab('file')">上传图片</button>
        </div>
        
        <div id="urlTab" class="tab-content active">
            <label>图片URL:</label>
            <input type="text" id="imageUrl" value="https://hivemoderation.com/images/31f7d53.png" placeholder="输入图片URL">
        </div>
        
        <div id="fileTab" class="tab-content">
            <label>选择图片文件:</label>
            <input type="file" id="imageFile" accept=".jpg,.jpeg,.png,.webp,.gif" onchange="previewFile()">
            <img id="previewImage" alt="预览图">
        </div>
        
        <button id="detectBtn" onclick="detectImage()">开始检测</button>
        
        <div id="loading" class="loading" style="display: none;">
            检测中...
        </div>
        
        <div id="result" class="result" style="display: none;">
            <h3>检测结果</h3>
            <div>
                <p>AI生成置信度: <span id="aiScore">0%</span></p>
                <div class="score-bar">
                    <div id="aiBar" class="score-fill ai-generated" style="width: 0%"></div>
                </div>
            </div>
            <div>
                <p>非AI生成置信度: <span id="notAiScore">0%</span></p>
                <div class="score-bar">
                    <div id="notAiBar" class="score-fill not-ai-generated" style="width: 0%"></div>
                </div>
            </div>
            <div>
                <p>Deepfake置信度: <span id="deepfakeScore">0%</span></p>
                <div class="score-bar">
                    <div id="deepfakeBar" class="score-fill deepfake" style="width: 0%"></div>
                </div>
            </div>
            <div style="margin-top: 20px;">
                <p><strong>判定结果:</strong></p>
                <p id="verdict">-</p>
            </div>
            <div style="margin-top: 20px;">
                <p><strong>完整响应:</strong></p>
                <pre id="fullResponse"></pre>
            </div>
        </div>
    </div>

    <script>
        const API_ENDPOINT = '/api/detect';
        let currentTab = 'url';

        window.onload = function() {
            loadUsageInfo();
        }

        async function loadUsageInfo() {
            try {
                const response = await fetch(API_ENDPOINT);
                const data = await response.json();
                if (data.success) {
                    document.getElementById('usageInfo').textContent = 
                        `已使用 ${data.used}/${data.max} 次，剩余 ${data.remaining} 次`;
                }
            } catch (error) {
                document.getElementById('usageInfo').textContent = '加载使用信息失败';
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
            document.getElementById('result').style.display = 'none';
        }

        function previewFile() {
            const file = document.getElementById('imageFile').files[0];
            const preview = document.getElementById('previewImage');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            } else {
                preview.style.display = 'none';
            }
        }

        async function detectImage() {
            const btn = document.getElementById('detectBtn');
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('result');

            btn.disabled = true;
            loading.style.display = 'block';
            resultDiv.style.display = 'none';

            try {
                let response;
                
                if (currentTab === 'url') {
                    const imageUrl = document.getElementById('imageUrl').value;
                    if (!imageUrl) {
                        alert('请输入图片URL');
                        btn.disabled = false;
                        loading.style.display = 'none';
                        return;
                    }
                    
                    response = await fetch(API_ENDPOINT, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({
                            input: [
                                {
                                    media_url: imageUrl
                                }
                            ]
                        })
                    });
                } else {
                    const file = document.getElementById('imageFile').files[0];
                    if (!file) {
                        alert('请选择图片文件');
                        btn.disabled = false;
                        loading.style.display = 'none';
                        return;
                    }
                    
                    const formData = new FormData();
                    formData.append('media', file);
                    
                    response = await fetch(API_ENDPOINT, {
                        method: 'POST',
                        body: formData
                    });
                }

                const result = await response.json();
                
                if (!result.success) {
                    alert(result.message || '检测失败');
                    return;
                }
                
                displayResult(result.raw);
                loadUsageInfo();
            } catch (error) {
                alert('API调用失败: ' + error.message);
                console.error(error);
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function displayResult(result) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';

            document.getElementById('fullResponse').textContent = JSON.stringify(result, null, 2);

            if (!result || !result.output || !result.output[0]) {
                return;
            }

            const classes = result.output[0].classes;
            const aiGenerated = classes.find(c => c.class === 'ai_generated');
            const notAiGenerated = classes.find(c => c.class === 'not_ai_generated');
            const deepfake = classes.find(c => c.class === 'deepfake');

            const aiValue = aiGenerated ? aiGenerated.value : 0;
            const notAiValue = notAiGenerated ? notAiGenerated.value : 0;
            const deepfakeValue = deepfake ? deepfake.value : 0;

            document.getElementById('aiScore').textContent = (aiValue * 100).toFixed(2) + '%';
            document.getElementById('aiBar').style.width = (aiValue * 100) + '%';

            document.getElementById('notAiScore').textContent = (notAiValue * 100).toFixed(2) + '%';
            document.getElementById('notAiBar').style.width = (notAiValue * 100) + '%';

            document.getElementById('deepfakeScore').textContent = (deepfakeValue * 100).toFixed(2) + '%';
            document.getElementById('deepfakeBar').style.width = (deepfakeValue * 100) + '%';

            let verdict = '';
            if (aiValue >= 0.9) {
                verdict += '⚠️ 高度疑似AI生成图片！';
            }
            if (deepfakeValue >= 0.9) {
                verdict += '\n⚠️ 高度疑似Deepfake图片！';
            }
            if (!verdict) {
                verdict = '✅ 图片看起来是真实的';
            }
            document.getElementById('verdict').textContent = verdict;
        }
    </script>
</body>
</html>
