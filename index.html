<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AI图片检测工具</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 50px auto;
            padding: 20px;
        }
        .container {
            background: #f5f5f5;
            padding: 20px;
            border-radius: 8px;
        }
        .usage-info {
            background: #e3f2fd;
            padding: 12px;
            border-radius: 4px;
            margin-bottom: 20px;
            text-align: center;
        }
        .tab-container {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
        }
        .tab-btn {
            flex: 1;
            padding: 10px;
            border: none;
            background: #ddd;
            cursor: pointer;
            border-radius: 4px;
        }
        .tab-btn.active {
            background: #007bff;
            color: white;
        }
        .tab-content {
            display: none;
        }
        .tab-content.active {
            display: block;
        }
        #previewImage {
            max-width: 100%;
            max-height: 300px;
            margin: 10px 0;
            display: none;
            border-radius: 4px;
        }

        input[type="text"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 1px solid #ddd;
            border-radius: 4px;
            box-sizing: border-box;
        }
        input[type="file"] {
            width: 100%;
            padding: 10px;
            margin: 10px 0;
            border: 2px dashed #ddd;
            border-radius: 4px;
            cursor: pointer;
        }
        button {
            background: #007bff;
            color: white;
            border: none;
            padding: 12px 24px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
        }
        button:hover {
            background: #0056b3;
        }
        button:disabled {
            background: #ccc;
            cursor: not-allowed;
        }
        .result {
            margin-top: 20px;
            padding: 15px;
            background: white;
            border-radius: 4px;
            border: 1px solid #ddd;
        }
        .score-bar {
            height: 20px;
            background: #e0e0e0;
            border-radius: 10px;
            margin: 5px 0;
            overflow: hidden;
        }
        .score-fill {
            height: 100%;
            transition: width 0.3s ease;
        }
        .ai-generated {
            background: #ff6b6b;
        }
        .not-ai-generated {
            background: #4ecdc4;
        }
        .deepfake {
            background: #ffd93d;
        }
        .loading {
            text-align: center;
            padding: 20px;
        }
        pre {
            background: #f8f9fa;
            padding: 10px;
            border-radius: 4px;
            overflow-x: auto;
            font-size: 12px;
        }
        .verdict {
            font-size: 18px;
            font-weight: bold;
            padding: 15px;
            border-radius: 4px;
            text-align: center;
            margin-top: 15px;
        }
        .verdict-warning {
            background: #fff3cd;
            color: #856404;
        }
        .verdict-success {
            background: #d4edda;
            color: #155724;
        }
        .generators {
            margin-top: 15px;
        }
        .generator-tag {
            display: inline-block;
            background: #e9ecef;
            padding: 6px 12px;
            border-radius: 20px;
            margin: 5px 5px 5px 0;
            font-size: 14px;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1 style="text-align: center;">🔍 AI图片检测工具</h1>
        
        <div class="usage-info" id="usageInfo">
            加载中...
        </div>
        
        <div class="tab-container">
            <button class="tab-btn active" onclick="switchTab('url')">图片URL</button>
            <button class="tab-btn" onclick="switchTab('file')">上传图片</button>
        </div>
        
        <div id="urlTab" class="tab-content active">
            <label>图片URL:</label>
            <input type="text" id="imageUrl" value="https://hivemoderation.com/images/31f7d53.png" placeholder="输入图片URL">
        </div>
        
        <div id="fileTab" class="tab-content">
            <label>选择图片文件:</label>
            <input type="file" id="imageFile" accept=".jpg,.jpeg,.png,.webp,.gif" onchange="previewFile()">
            <img id="previewImage" alt="预览图">
        </div>
        
        <button id="detectBtn" onclick="detectImage()">开始检测</button>
        
        <div id="loading" class="loading" style="display: none;">
            <div style="font-size: 18px;">🔄 检测中，请稍候...</div>
        </div>
        
        <div id="result" class="result" style="display: none;">
            <h3>📊 检测结果</h3>
            <div>
                <p><strong>AI生成置信度:</strong> <span id="aiScore">0%</span></p>
                <div class="score-bar">
                    <div id="aiBar" class="score-fill ai-generated" style="width: 0%"></div>
                </div>
            </div>
            <div>
                <p><strong>非AI生成置信度:</strong> <span id="notAiScore">0%</span></p>
                <div class="score-bar">
                    <div id="notAiBar" class="score-fill not-ai-generated" style="width: 0%"></div>
                </div>
            </div>
            <div>
                <p><strong>Deepfake置信度:</strong> <span id="deepfakeScore">0%</span></p>
                <div class="score-bar">
                    <div id="deepfakeBar" class="score-fill deepfake" style="width: 0%"></div>
                </div>
            </div>
            
            <div id="verdict"></div>
            
            <div id="generators" class="generators" style="display: none;">
                <p><strong>可能的AI生成器:</strong></p>
                <div id="generatorTags"></div>
            </div>
            
            <div style="margin-top: 20px;">
                <p><strong>完整响应:</strong></p>
                <pre id="fullResponse"></pre>
            </div>
        </div>
    </div>

    <script>
        const API_ENDPOINT = '/api/detect';
        let currentTab = 'url';
        
        window.onload = function() {
            loadUsageInfo();
        };

        async function loadUsageInfo() {
            try {
                const response = await fetch(API_ENDPOINT, { method: 'GET' });
                const data = await response.json();
                if (data.success) {
                    document.getElementById('usageInfo').innerHTML = 
                        `已使用 <strong>${data.used}</strong> / ${data.max} 次，剩余 <strong>${data.remaining}</strong> 次`;
                }
            } catch (error) {
                console.error('加载使用信息失败', error);
            }
        }

        function switchTab(tab) {
            currentTab = tab;
            document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
            document.querySelectorAll('.tab-content').forEach(content => content.classList.remove('active'));
            
            event.target.classList.add('active');
            document.getElementById(tab + 'Tab').classList.add('active');
            document.getElementById('result').style.display = 'none';
        }

        function previewFile() {
            const file = document.getElementById('imageFile').files[0];
            const preview = document.getElementById('previewImage');
            
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    preview.src = e.target.result;
                    preview.style.display = 'block';
                }
                reader.readAsDataURL(file);
            } else {
                preview.style.display = 'none';
            }
        }

        async function detectImage() {
            const btn = document.getElementById('detectBtn');
            const loading = document.getElementById('loading');
            const resultDiv = document.getElementById('result');

            btn.disabled = true;
            loading.style.display = 'block';
            resultDiv.style.display = 'none';

            try {
                let response;
                
                if (currentTab === 'url') {
                    const imageUrl = document.getElementById('imageUrl').value;
                    if (!imageUrl) {
                        alert('请输入图片URL');
                        btn.disabled = false;
                        loading.style.display = 'none';
                        return;
                    }
                    
                    response = await fetch(API_ENDPOINT, {
                        method: 'POST',
                        headers: {
                            'Content-Type': 'application/json'
                        },
                        body: JSON.stringify({ url: imageUrl })
                    });
                } else {
                    const file = document.getElementById('imageFile').files[0];
                    if (!file) {
                        alert('请选择图片文件');
                        btn.disabled = false;
                        loading.style.display = 'none';
                        return;
                    }
                    
                    const formData = new FormData();
                    formData.append('media', file);
                    
                    response = await fetch(API_ENDPOINT, {
                        method: 'POST',
                        body: formData
                    });
                }

                const result = await response.json();
                
                if (!result.success) {
                    alert(result.message || '检测失败');
                    return;
                }
                
                displayResult(result);
                loadUsageInfo();
            } catch (error) {
                alert('API调用失败: ' + error.message);
                console.error(error);
            } finally {
                btn.disabled = false;
                loading.style.display = 'none';
            }
        }

        function displayResult(result) {
            const resultDiv = document.getElementById('result');
            resultDiv.style.display = 'block';

            document.getElementById('fullResponse').textContent = JSON.stringify(result.raw, null, 2);

            const data = result.data;
            if (!data) {
                return;
            }

            const aiValue = data.ai_generated || 0;
            const notAiValue = data.not_ai_generated || 0;
            const deepfakeValue = data.deepfake || 0;

            document.getElementById('aiScore').textContent = (aiValue * 100).toFixed(2) + '%';
            document.getElementById('aiBar').style.width = (aiValue * 100) + '%';

            document.getElementById('notAiScore').textContent = (notAiValue * 100).toFixed(2) + '%';
            document.getElementById('notAiBar').style.width = (notAiValue * 100) + '%';

            document.getElementById('deepfakeScore').textContent = (deepfakeValue * 100).toFixed(2) + '%';
            document.getElementById('deepfakeBar').style.width = (deepfakeValue * 100) + '%';

            const verdictDiv = document.getElementById('verdict');
            let verdictText = '';
            let verdictClass = 'verdict';
            
            if (data.is_ai_generated && data.is_deepfake) {
                verdictText = '⚠️ 高度疑似AI生成图片 + Deepfake！';
                verdictClass += ' verdict-warning';
            } else if (data.is_ai_generated) {
                verdictText = '⚠️ 高度疑似AI生成图片！';
                verdictClass += ' verdict-warning';
            } else if (data.is_deepfake) {
                verdictText = '⚠️ 高度疑似Deepfake图片！';
                verdictClass += ' verdict-warning';
            } else {
                verdictText = '✅ 图片看起来是真实的';
                verdictClass += ' verdict-success';
            }
            
            verdictDiv.className = verdictClass;
            verdictDiv.textContent = verdictText;

            const generatorsDiv = document.getElementById('generators');
            const generatorTagsDiv = document.getElementById('generatorTags');
            
            if (data.generators && data.generators.length > 0) {
                generatorsDiv.style.display = 'block';
                generatorTagsDiv.innerHTML = '';
                
                const generatorNames = {
                    'midjourney': 'Midjourney',
                    'stable_diffusion': 'Stable Diffusion',
                    'stable_diffusion_xl': 'Stable Diffusion XL',
                    'dalle': 'DALL-E',
                    'ideogram': 'Ideogram',
                    'leonardo': 'Leonardo',
                    'bing_image_creator': 'Bing Image Creator',
                    'adobe_firefly': 'Adobe Firefly',
                    'flux': 'Flux',
                    'flux2': 'Flux 2',
                    'qwen': 'Qwen',
                    'other_image_generators': '其他AI工具'
                };
                
                data.generators.forEach(gen => {
                    const tag = document.createElement('span');
                    tag.className = 'generator-tag';
                    const name = generatorNames[gen.name] || gen.name;
                    tag.textContent = `${name} ${(gen.score * 100).toFixed(0)}%`;
                    generatorTagsDiv.appendChild(tag);
                });
            } else {
                generatorsDiv.style.display = 'none';
            }
        }
    </script>
</body>
</html>
